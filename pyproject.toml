[project]
name = "agentprobe"
version = "0.1.0"
description = "Industry-grade evaluation framework for LLM coding agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Aditya Chauhan", email = "aditya9599chauhan@gmail.com" },
]
keywords = [
    "llm",
    "evaluation",
    "agents",
    "benchmark",
    "swe-bench",
]

# ── Phase 1 Dependencies ─────────────────────────────────────
dependencies = [
    "pydantic>=2.0",          # Data models & validation
    "pyyaml>=6.0",            # YAML config file support
    "rich>=13.0",             # Beautiful terminal output
]

[project.urls]
Homepage = "https://github.com/adi1-simplyLovely/agentprobe"
Repository = "https://github.com/adi1-simplyLovely/agentprobe"
Issues = "https://github.com/adi1-simplyLovely/agentprobe/issues"

# ── Development Dependencies ─────────────────────────────────
[dependency-groups]
dev = [
    "pytest>=8.0",            # Testing framework
    "pytest-cov>=5.0",        # Test coverage reporting
    "pytest-asyncio>=0.24",   # Async test support
    "ruff>=0.8",              # Linter + formatter (replaces flake8, black, isort)
    "mypy>=1.10",             # Static type checking
    "pre-commit>=3.0",        # Git hooks for auto-linting
]

# ── Ruff Configuration (Linter + Formatter) ──────────────────
[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "N",    # pep8-naming
    "UP",   # pyupgrade
]

[tool.ruff.format]
quote-style = "double"

# ── Pytest Configuration ─────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

# ── MyPy Configuration (Type Checking) ───────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

# ── Build System ─────────────────────────────────────────────
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
